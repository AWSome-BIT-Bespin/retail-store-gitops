# Verified against Helm retail-dev and live retail-dev-eks resources, 2026-09-16.
# Credentials remain in existing Kubernetes Secrets and ExternalSecrets.
cart:
  image:
    repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-cart
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: retail-dev-cart
        createTable: false
        tableNameSecret:
          name: retail-runtime-config
          key: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
  dynamodb:
    create: false
  serviceAccount:
    create: true
    name: retail-dev-cart
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::350606136784:role/RetailDevCartDynamoDBRole

catalog:
  image:
    repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-catalog
  metrics:
    enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
  app:
    persistence:
      provider: in-memory
  whatap:
    enabled: true
    secretName: whatap-credentials
    serverHost: 13.124.11.223/13.209.172.35
    appName: catalog
    okind: catalog

checkout:
  image:
    repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-checkout
  metrics:
    enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /metrics
  app:
    persistence:
      provider: redis
      redis:
        endpoint: retail-dev-valkey.lk6esl.ng.0001.apn2.cache.amazonaws.com:6379
        secretName: ""
        tls: false
    endpoints:
      orders: http://orders:80
  redis:
    create: false
  whatap:
    enabled: true
    secretName: whatap-credentials
    serverHost: 13.124.11.223/13.209.172.35
    okind: checkout

orders:
  image:
    repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-orders
  metrics:
    enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /actuator/prometheus
  app:
    persistence:
      provider: postgres
      endpoint: retail-dev-orders.cmnrhpznom2o.ap-northeast-2.rds.amazonaws.com:5432
      database: orders
      secret:
        create: false
        name: orders-db
    messaging:
      provider: in-memory
      rabbitmq:
        secret:
          create: false
  postgresql:
    create: false
  rabbitmq:
    create: false

ui:
  image:
    repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-ui
  metrics:
    enabled: true
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
      prometheus.io/path: /actuator/prometheus
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/load-balancer-name: retail-dev-alb
  app:
    session:
      redis:
        endpoint: retail-dev-valkey.lk6esl.ng.0001.apn2.cache.amazonaws.com:6379
        secretName: ""
        tls: false
