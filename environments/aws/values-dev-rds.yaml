cart:
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: retail-store-cart
        createTable: false
  dynamodb:
    create: false

  # 기존: create=false, name=carts-dynamo
  # 변경: Helm에서 carts-dynamo-sa 생성(Pod Identity용 annotation 없음)
  serviceAccount:
    create: true
    name: carts-dynamo-sa
    annotations: {}

catalog:
  app:
    persistence:
      provider: in-memory
  whatap:
    enabled: false
    secretName: catalog-whatap
    secretHost: ""
  # 기존: 서비스 어카운트 명시 설정 없음
  # 변경: Helm에서 catalog-sa 생성
  serviceAccount:
    create: true
    name: catalog-sa
    annotations: {}

checkout:
  app:
    persistence:
      provider: redis
      redis:
        endpoint: ""
        secretName: retail-redis
        tls: false
    endpoints:
      orders: http://orders:80
  redis:
    create: false

  whatap:
    enabled: false
    secretName: checkout-whatap
    secretHost: ""

  # 기존: 서비스 어카운트 명시 설정 없음
  # 변경: Helm에서 checkout-sa 생성
  serviceAccount:
    create: true
    name: checkout-sa
    annotations: {}


orders:
  app:
    persistence:
      provider: postgres
      endpoint: ""
      database: orders
      secret:
        create: false
        name: orders-db

    messaging:
      provider: in-memory
      rabbitmq:
        secret:
          create: false
  # 기존: 서비스 어카운트 명시 설정 없음
  # 변경: Helm에서 orders-sa 생성
  serviceAccount:
    create: true
    name: orders-sa
    annotations: {}

  postgresql:
    create: false

  rabbitmq:
    create: false

ui:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: alb
  app:
    session:
      redis:
        endpoint: ""
        secretName: retail-redis
        tls: false

  # 기존: 서비스 어카운트 명시 설정 없음
  # 변경: Helm에서 ui-sa 생성
  serviceAccount:
    create: true
    name: ui-sa
    annotations: {}
