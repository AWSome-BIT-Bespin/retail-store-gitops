# Existing retail-store release, manually synchronized after diff review.
# No automated sync, pruning or cascading-delete finalizer.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retail-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AWSome-BIT-Bespin/retail-store-gitops.git
    targetRevision: main
    path: src/app/chart
    helm:
      releaseName: retail-store
      skipTests: true
      valueFiles:
        - ../../../environments/aws/values.yaml
        - versions.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: retail-store
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
