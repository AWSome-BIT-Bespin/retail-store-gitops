apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
spec:
{{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
{{- end }}
  strategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.metrics.enabled }}
      annotations:
        {{- include "catalog.podAnnotations" . | nindent 8 }}
        {{- if and .Values.opentelemetry.enabled .Values.opentelemetry.instrumentation (not .Values.whatap.enabled) }}
        instrumentation.opentelemetry.io/inject-sdk: {{ .Values.opentelemetry.instrumentation }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "catalog.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "catalog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ "catalog" }}
          envFrom:
            - configMapRef:
                name: {{ include "catalog.configMapName" . }}
            {{- if or (eq "mysql" .Values.app.persistence.provider) (.Values.app.search.enabled) }}
            - secretRef:
                name: {{ .Values.app.persistence.secret.name }}
            {{- end }}
          {{- if .Values.whatap.enabled }}
          env:
            # 기존 OpenTelemetry와 중복 계측되지 않게 합니다.
            - name: OTEL_ENABLED
              value: "false"
            # emptyDir에 설정 파일과 로그를 기록합니다.
            - name: WHATAP_HOME
              value: "/whatap"
            # 실제 키는 같은 namespace의 Secret에서만 읽습니다.
            - name: WHATAP_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ required "whatap.secretName is required when whatap.enabled=true" .Values.whatap.secretName | quote }}
                  key: license
            - name: WHATAP_SERVER_HOST
              value: {{ required "whatap.serverHost is required when whatap.enabled=true" .Values.whatap.serverHost | quote }}
            - name: WHATAP_APP_NAME
              value: {{ .Values.whatap.appName | quote }}
            - name: WHATAP_OKIND
              value: {{ .Values.whatap.okind | quote }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.Version }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
            {{- if .Values.whatap.enabled }}
            - mountPath: /whatap
              name: whatap-home
            {{- end }}
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
        {{- if .Values.whatap.enabled }}
        - name: whatap-home
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
