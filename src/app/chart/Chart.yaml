apiVersion: v2
name: retail-store-chart
description: A Helm chart for the AWS retail store containers sample application
type: application
# UI dependency patch bump를 반영한 Umbrella Chart patch bump
version: 1.6.5
dependencies:
  - name: retail-store-cart-chart
    alias: cart
    version: v0.0.1
    repository: file://../../cart/chart
  - name: retail-store-catalog-chart
    alias: catalog
    version: v0.0.1
    repository: file://../../catalog/chart
  - name: retail-store-checkout-chart
    alias: checkout
    version: v0.0.1
    repository: file://../../checkout/chart
  - name: retail-store-orders-chart
    alias: orders
    version: v0.1.0
    repository: file://../../orders/chart
  - name: retail-store-ui-chart
    alias: ui
    # UI local/redis Session mode 분기 버전
    version: v0.1.3
    repository: file://../../ui/chart
