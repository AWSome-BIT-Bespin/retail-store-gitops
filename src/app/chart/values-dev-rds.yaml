cart:
  app:
    persistence:
      provider: dynamodb
      dynamodb:
        tableName: retail-store-cart
        createTable: false
  dynamodb:
    create: false

  serviceAccount:
    create: false
    name: carts-dynamo
    annotations: {}

catalog:
  app:
    persistence:
      provider: in-memory
  whatap:
    enabled: false
    secretName: catalog-whatap
    secretHost: ""

checkout:
  app:
    persistence:
      provider: redis
      redis:
        endpoint: ""
        secretName: retail-redis
        tls: false
    endpoints:
      orders: http://orders:80
  redis:
    create: false

  whatap:
    enabled: false
    secretName: checkout-whatap
    secretHost: ""


orders:
  app:
    persistence:
      provider: postgres
      endpoint: ""
      database: orders
      secret:
        create: false
        name: orders-db

    messaging:
      provider: in-memory
      rabbitmq:
        secret:
          create: false

  postgresql:
    create: false

  rabbitmq:
    create: false

ui:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: alb
  app:
    session:
      redis:
        endpoint: ""
        secretName: retail-redis
        tls: false
