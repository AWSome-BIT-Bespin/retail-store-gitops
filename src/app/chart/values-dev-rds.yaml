cart:
  app:
    persistence:
      provider: in-memory


catalog:
  app:
    persistence:
      provider: in-memory


checkout:
  app:
    persistence:
      provider: redis
    endpoints:
      orders: http://orders:80
  redis:
    create: true

orders:
  app:
    persistence:
      provider: postgres
      endpoint: "retail-test-orders.cmnrhpznom2o.ap-northeast-2.rds.amazonaws.com:5432"
      database: orders
      secret:
        create: false
        name: orders-db

    messaging:
      provider: in-memory
      rabbitmq:
        secret:
          create: false

  postgresql:
    create: false

  rabbitmq:
    create: false

ui:
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: alb