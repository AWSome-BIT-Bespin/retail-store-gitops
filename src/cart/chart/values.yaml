# Default values for carts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

#replicaCount: 1

image:
  repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-cart
  pullPolicy: IfNotPresent
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

networkPolicy:
  # Ingress만 제한합니다. AWS 환경 values에서 이 앱의 정책을 활성화합니다.
  enabled: false
  # 같은 네임스페이스의 호출 앱 라벨입니다. nameOverride 변경 시 name도 맞춥니다.
  # releaseName이 비어 있으면 이 차트의 릴리스 이름을 사용합니다.
  allowedClients:
    - name: ui
      releaseName: ""
  monitoring:
    # 지정한 네임스페이스의 모든 Pod에 http 포트를 허용합니다. 빈 값이면 생략합니다.
    namespace: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints:
  # Spread replicas of the same app and Helm release across at least two nodes.
  - maxSkew: 1
    minDomains: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: service
    matchLabelKeys:
      - app.kubernetes.io/name
      - app.kubernetes.io/instance

metrics:
  enabled: true
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"

configMap:
  create: true
  name:

app:
  persistence:
    provider: in-memory
    dynamodb:
      tableName: Items
      createTable: false
      tableNameSecret:
        name: ""
        key: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME

dynamodb:
  create: false

  image:
    repository: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local
    pullPolicy: IfNotPresent
    tag: "1.25.1"

  service:
    type: ClusterIP
    port: 8000

  podAnnotations: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

opentelemetry:
  enabled: false
  instrumentation: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 2
  maxUnavailable: 1
