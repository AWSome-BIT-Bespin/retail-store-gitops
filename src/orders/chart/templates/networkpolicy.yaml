{{- if .Values.networkPolicy.enabled }}
# 기본 allowedClients는 UI와 Checkout이며 이름/릴리스를 앱별 values에서 지정합니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-orders
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orders.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      {{- include "orders.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or .Values.networkPolicy.allowedClients .Values.networkPolicy.monitoring.namespace }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedClients }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ required "networkPolicy.allowedClients[].name is required" .name | quote }}
              app.kubernetes.io/instance: {{ default $.Release.Name .releaseName | quote }}
              app.kubernetes.io/component: service
              app.kubernetes.io/owner: retail-store-sample
        {{- end }}
        {{- with .Values.networkPolicy.monitoring.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
