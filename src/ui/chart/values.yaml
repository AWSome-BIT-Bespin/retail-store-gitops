# Default values for ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

#replicaCount: 1

image:
  repository: 350606136784.dkr.ecr.ap-northeast-2.amazonaws.com/retail-ui
  pullPolicy: IfNotPresent
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

networkPolicy:
  # Ingress만 제한합니다. AWS 환경 values에서 이 앱의 정책을 활성화합니다.
  enabled: false
  # 빈 목록은 모든 출발지의 http 포트(TCP 8080) 접근을 허용합니다.
  # 실제 ALB 출발지 서브넷 CIDR을 지정하면 접근 범위를 좁힙니다.
  ingressCidrs: []
  monitoring:
    # 지정한 네임스페이스의 모든 Pod에 http 포트를 허용합니다. 빈 값이면 생략합니다.
    namespace: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: #
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  # annotations: {}
  # loadBalancerClass: ""
  # nodePort: 30000

resources:
  limits:
    memory: 768Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 12

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
      
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints:
  # Spread replicas of the same app and Helm release across at least two nodes.
  - maxSkew: 1
    minDomains: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: service
    matchLabelKeys:
      - app.kubernetes.io/name
      - app.kubernetes.io/instance

metrics:
  enabled: false
  #podAnnotations:
  # prometheus.io/scrape: "true"
  #prometheus.io/port: "8080"
  #prometheus.io/path: "/actuator/prometheus"

configMap:
  create: true
  name: # if blank this will be generated

app:
  theme: default
  endpoints: {}
    #catalog: http://catalog:80
    #carts: http://carts:80
    #orders: http://orders:80
    #checkout: http://checkout:80
    #recommendations: http://recommendations:80
  session:
    type: auto
    redis:
      endpoint: ""
      secretName: ""
  search:
    enabled: false
  chat:
    enabled: false
    provider: ""
    model: ""
    # temperature: 0.7
    # maxTokens: 300
    # prompt: |
    #   This will override the default system prompt
    bedrock:
      region: ""
    openai:
      baseUrl: ""
      # apiKey: ""

## Ingress for load balancer
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: retail-store-alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/liveness
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  hosts: []
  #  - "chart-example.local"

#ingresses: []
# - name: default
#   className: ""
#   hosts: []
#   annotations: {}
#   tls: []

#ingresses: []
# - name: default
#   className: ""
#   hosts: []
#   annotations: {}
#   tls: []

istio:
  enabled: false
  hosts: []

opentelemetry:
  enabled: false
  instrumentation: ""

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1
